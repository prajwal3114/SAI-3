services:
  - type: web
    name: service-snaps-api
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: service-snaps-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
